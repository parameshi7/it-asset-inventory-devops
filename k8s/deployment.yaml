
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  labels:
    app: inventory-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-app

  template:
    metadata:
      labels:
        app: inventory-app

    spec:
      containers:
        - name: inventory-app
          image: it-asset-inventory:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: inventory-mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: it_asset_inventory
            - name: DB_USER
              value: appuser
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: MYSQL_PASSWORD
            - name: PORT
              value: "8080"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
